steps:
- task: UseDotNet@2
  displayName: 'Install .NET Core 10.x SDK'
  inputs:
    version: 10.x
    performMultiLevelLookup: true

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'
  displayName: 'dotnet restore'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'
  displayName: 'dotnet build'

- task: DotNetCoreCLI@2
  inputs:
    command: 'test'
    projects: 'Test/BiblePlaylist.Tests/BiblePlaylist.Tests.csproj'
    # MTP mode: the task must NOT append '--logger trx' (VSTest option, rejected
    # by the test app with exit code 5). publishTestResults: false stops it;
    # '--report-trx' is the MTP equivalent, provided by the
    # Microsoft.Testing.Extensions.TrxReport package in the test project.
    publishTestResults: false
    arguments: '--configuration $(buildConfiguration) --no-restore --report-trx --results-directory $(Agent.TempDirectory)'
  displayName: 'dotnet test'

- task: PublishTestResults@2
  inputs:
    testRunner: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/**/*.trx'
  displayName: 'Publish test results'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish (Server only)'
  inputs:
    command: 'publish'
    publishWebProjects: false                # ← Critical: disable auto web project detection
    projects: 'BiblePlaylist/Server/BiblePlaylist.Server.csproj'   # ← Explicitly target Server
    arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true                    # ← Optional but recommended: zips output → produces Server.zip or similar
    modifyOutputPath: false                  # ← Helps keep clean output if needed

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'